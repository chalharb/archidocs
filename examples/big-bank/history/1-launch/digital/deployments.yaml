deployments:
  - service: web-app
    environment: prod
    target: platform:eks-prod
    url: https://bigbank.example/ib
  - service: web-app
    environment: staging
    target: platform:eks-staging
    url: https://staging.bigbank.example/ib
  - service: api
    environment: prod
    target: platform:eks-prod
    url: https://api.bigbank.example
    endpoints:
      - name: health
        url: https://api.bigbank.example/actuator/health
  - service: api
    environment: staging
    target: platform:eks-staging
    url: https://api.staging.bigbank.example
  - service: database
    environment: prod
    target: platform:eks-prod
