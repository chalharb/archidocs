deployments:
  - service: auth-service
    environment: prod
    target: platform:eks-prod
    url: https://login.bigbank.example
    endpoints:
      - name: discovery
        url: https://login.bigbank.example/.well-known/openid-configuration
  - service: auth-service
    environment: staging
    target: platform:eks-staging
    url: https://login.staging.bigbank.example
  - service: user-directory
    environment: prod
    target: platform:eks-prod
