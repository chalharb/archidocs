systems:
  identity:
    name: Identity Platform
    description: Signs customers in and keeps their credentials.
    services:
      auth-service:
        name: Auth Service
        description: OpenID Connect provider for every customer-facing app.
        technology: Keycloak
        relationships:
          - to: user-directory
            description: Reads and writes credentials in
            technology: LDAP
          - to: platform:email-system
            description: Sends password-reset e-mails through
            technology: SMTP
      user-directory:
        name: User Directory
        type: datastore
        technology: OpenLDAP
