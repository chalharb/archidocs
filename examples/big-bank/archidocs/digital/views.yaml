views:
  structural:
    #region mainframe-outage
    mainframe-outage:
      title: What a mainframe outage takes down
      description: Everything that depends on the mainframe, directly or not.
      level: c2
      include:
        - element: core:mainframe
          upstream: all
      lens:
        impact: core:mainframe
        direction: upstream
    #endregion
    sign-in-path:
      title: How a customer signs in
      level: c3
      include:
        - from: customer
          to: identity:auth-service
      direction: LR
    #region prod-deployment
    prod-deployment:
      title: Internet banking in production
      level: deployment
      environment: prod
      include:
        - element: internet-banking
          with: descendants
    #endregion
  dynamic:
    #region sign-in
    sign-in:
      title: Customer signs in
      steps:
        - from: customer
          to: spa
          description: Enters username and password
        - from: spa
          to: sign-in-controller
          description: POST /api/sign-in
        - from: sign-in-controller
          to: security-component
          description: Checks the session
        - from: security-component
          to: identity:auth-service
          description: Validates the token
        - from: identity:auth-service
          to: security-component
          return: true
          description: Token valid
        - from: sign-in-controller
          to: spa
          return: true
          description: Session cookie
    #endregion
