#region targets
targets:
  cloud:
    name: Cloud region
    kind: region
    targets:
      cluster:
        name: Kubernetes cluster
        kind: cluster
#endregion

#region deployments
deployments:
  - service: web
    environment: prod
    target: cluster
    url: https://shop.sink.example
  - service: api
    environment: prod
    target: cluster
    url: https://api.sink.example
    instances: 3
    endpoints:
      - name: health
        url: https://api.sink.example/healthz
  - service: orders-db
    environment: prod
    target: cloud
  - service: events
    environment: prod
    target: cloud
  - service: mailer
    environment: prod
    target: cluster
  - service: search
    environment: prod
    target: cloud
#endregion
