views:
  #region structural
  structural:
    everything:
      title: Everything
      description: Every Element, with Shop and API open.
      level: c3
      include:
        - element: shop
          with: descendants
        - customer
        - search
        - payment-gateway
        - payments-provider
    orders-db-outage:
      title: What an Orders DB outage affects
      description: The Services that depend on Orders DB, with the Impact Lens on.
      level: c2
      include:
        - element: orders-db
          upstream: all
      exclude:
        - customer
      lens:
        impact: orders-db
        direction: upstream
  #endregion
  #region dynamic
  dynamic:
    place-order:
      title: Customer places an order
      description: A call, a derived edge, an event through the broker and the replies.
      steps:
        - from: customer
          to: web
          description: Checks out
        - from: web
          to: api
          description: POST /orders
        - from: api
          to: orders-db
          description: Stores the order
        - from: api
          to: mailer
          description: orders.placed
        - from: api
          to: web
          return: true
          description: Order placed
  #endregion
