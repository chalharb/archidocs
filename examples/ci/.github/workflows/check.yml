# Check the Workspace on every pull request, without building or publishing.
name: Check architecture
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global archidocs@1
      - run: archidocs check --format github --strict
