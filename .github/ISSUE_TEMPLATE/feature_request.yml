name: Feature request
description: Suggest something Archidocs should do.
type: Request
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The task or question you have, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How Archidocs could help. A command, a field, a view or a tool.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now
      description: Any workaround you use, or other tools you've tried.
