name: Release

# Every merge to main runs release-please. It keeps one open "chore(main): release X.Y.Z"
# PR whose package.json version and CHANGELOG.md follow the Conventional Commit titles
# merged since the last release (fix → patch, feat → minor, `!` or BREAKING CHANGE → major).
# Merging that PR tags vX.Y.Z, creates the GitHub Release, and the publish job below
# publishes archidocs@X.Y.Z to npm, and the docs job deploys archidocs.dev from the same tag.
# Once npm has the release, the major-tag job moves the major tag (v1) to it: the docs tell
# people to use the Action as `chalharb/archidocs@v1` and the GitLab template from `v1`.
#
# npm authenticates with trusted publishing (OIDC), so the repo holds no npm token.
# One-time setup on npmjs.com: archidocs → Settings → Trusted Publisher →
# GitHub Actions, repository chalharb/archidocs, workflow publish.yml.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write # release-please labels its PRs
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # GITHUB_TOKEN works, but PRs it opens don't trigger CI. A token in
          # RELEASE_PLEASE_TOKEN (PAT or GitHub App) makes CI run on the release PR too.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          # `pnpm typecheck` runs `astro check`, which builds the MCP tool pages; their get_changes and list_history examples read the git history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: npm publish

  major-tag:
    # Moved only after publish passed, so `@v1` never points at a release whose tests failed.
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Move the major tag to this release
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          # v1.2.0 → v1
          major="${TAG%%.*}"
          git tag --force "$major"
          git push --force origin "refs/tags/$major"

  docs:
    # The docs site documents the released CLI, so production deploys only here, from the release tag.
    # Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see sites.yml); website/wrangler.jsonc
    # holds the Worker and its archidocs.dev Custom Domains.
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          # Full history: each docs page's "Last updated" date is the date of its file's last commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The docs build takes its screenshots of the viewer in Chromium (website/src/lib/screenshots.ts).
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm docs:build
      - run: pnpm exec wrangler deploy --cwd website
