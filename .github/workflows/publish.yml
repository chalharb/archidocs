name: Release

# Every push to `main` or `beta` runs semantic-release (release.config.mjs; why in
# docs/adr/0002-beta-branch-with-semantic-release.md). It reads the Conventional Commit titles
# since the branch's last release (fix → patch, feat → minor, `!` or BREAKING CHANGE → major) and,
# if any calls for one, releases:
#   - `beta`: X.Y.Z-beta.N to the npm `beta` dist-tag, a vX.Y.Z-beta.N tag and a GitHub
#     prerelease. Nothing is committed back, `v1` stays put and no production site deploys.
#   - `main`: X.Y.Z to `latest`, CHANGELOG.md and package.json committed back as
#     `chore(release): X.Y.Z [skip ci]`, the vX.Y.Z tag on that commit and a GitHub Release.
#     Once the published package passes the smoke check, `v1` moves to it (the docs tell people to
#     use the Action as `chalharb/archidocs@v1` and the GitLab template from `v1`), the docs and
#     demo sites deploy to production, and a PR merges `main` back into `beta`.
#
# npm authenticates with trusted publishing (OIDC), so the repo holds no npm token. The release job
# runs in the `npm` environment, which only `main` and `beta` may deploy to; on npmjs.com the
# archidocs Trusted Publisher names repository chalharb/archidocs, workflow publish.yml and that
# environment.
#
# RELEASE_TOKEN (a GitHub App token or fine-grained PAT with contents and pull-requests write) is
# required: it pushes the release commit past `main`'s ruleset, and PRs it opens trigger CI,
# which GITHUB_TOKEN's don't.
on:
  push:
    branches: [main, beta]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # OIDC for trusted publishing and provenance
    outputs:
      published: ${{ steps.release.outputs.published }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check for RELEASE_TOKEN
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::The RELEASE_TOKEN secret is not set. semantic-release needs it to push the release commit and tags (see the comment at the top of publish.yml)."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          # semantic-release reads every tag and commit since the last release. `pnpm typecheck` runs
          # `astro check`, which builds the MCP tool pages; their examples read the git history too.
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # semantic-release fetches tags without --force, so a floating major tag (v1) that moved on the
      # remote since checkout fails the run with "would clobber existing tag". Dropping the local
      # copies lets that fetch recreate them.
      - name: Drop local floating major tags
        run: git tag -l | grep -E '^v[0-9]+$' | xargs -r git tag -d
      - id: release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  smoke:
    # The package as users get it: installable from the registry, and reporting its own version.
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install and run the published package
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # The registry can take a minute to serve a new version.
          for attempt in $(seq 1 30); do
            if [ "$(npm view "archidocs@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then break; fi
            echo "archidocs@$VERSION is not on the registry yet (attempt $attempt)"
            sleep 10
          done
          actual="$(npx -y "archidocs@$VERSION" version --format json | jq -r .version)"
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::archidocs@$VERSION version reported '$actual'"
            exit 1
          fi
          echo "archidocs@$VERSION installs and reports $actual"

  major-tag:
    # Moved only after the smoke check passed, so `@v1` never points at a release that doesn't install.
    needs: [release, smoke]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
      - name: Move the major tag to this release
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # 1.2.0 → v1
          major="v${VERSION%%.*}"
          git tag --force "$major"
          git push --force origin "refs/tags/$major"

  sites:
    # The docs site documents the released CLI and the demos show its viewer, so production deploys
    # only here, from the release tag. Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see
    # sites.yml); each wrangler.jsonc holds its Worker and Custom Domains.
    needs: [release, smoke]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { site: docs, dir: website, build: "docs:build" }
          - { site: big-bank, dir: examples/big-bank, build: "demo:big-bank" }
          - { site: kitchen-sink, dir: examples/kitchen-sink, build: "demo:kitchen-sink" }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for the Cloudflare secrets
        id: credentials
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Cloudflare secrets here, so ${{ matrix.site }} is not deployed."
          fi
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
          # Full history: each docs page's "Last updated" date is the date of its file's last commit.
          fetch-depth: 0
      - if: steps.credentials.outputs.ready == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - if: steps.credentials.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      # The docs build takes its screenshots of the viewer in Chromium (website/src/lib/screenshots.ts).
      - if: steps.credentials.outputs.ready == 'true' && matrix.site == 'docs'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.credentials.outputs.ready == 'true'
        run: pnpm "${{ matrix.build }}"
      - if: steps.credentials.outputs.ready == 'true'
        run: pnpm exec wrangler deploy --cwd "${{ matrix.dir }}"

  back-merge:
    # `main` now has commits `beta` lacks (the release commit, and any hotfix). A PR brings them over;
    # it must be merged with a merge commit, or the next promotion from `beta` conflicts.
    needs: [release, smoke]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Open a PR from main into beta
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if ! gh api "repos/$REPO/branches/beta" --silent 2>/dev/null; then
            echo "::notice::There is no beta branch yet, so there is nothing to merge main into."
            exit 0
          fi
          if [ -n "$(gh pr list -R "$REPO" --base beta --head main --state open --json number -q '.[].number')" ]; then
            echo "A PR from main into beta is already open."
            exit 0
          fi
          gh pr create -R "$REPO" --base beta --head main \
            --title "chore: merge main into beta after v$VERSION" \
            --body "Brings the v$VERSION release commit (and any hotfixes) from \`main\` into \`beta\`.

          **Merge this with a merge commit, not a squash**, so \`main\`'s commits stay ancestors of \`beta\` and the next promotion doesn't conflict."
