name: Release

# CI's last job: ci.yml calls this workflow (`workflow_call`) for a push to `main` or `beta` once
# every other CI job has passed, on the commit CI tested; why in docs/adr/0003-release-gated-on-ci.md
# and docs/adr/0007-release-is-ci-last-job.md. CI is the gate, so this workflow only builds and
# releases. It runs with the pushed branch's own ref: `github.ref_name` is the branch being released.
# semantic-release (release.config.mjs; why in docs/adr/0002-beta-branch-with-semantic-release.md)
# reads the Conventional Commit titles since the branch's last release (fix → patch, feat → minor,
# `!` or BREAKING CHANGE → major) and, if any calls for one, releases:
#   - `beta`: X.Y.Z-beta.N to the npm `beta` dist-tag, package.json committed back as
#     `chore(release): X.Y.Z-beta.N [skip ci]`, the vX.Y.Z-beta.N tag on that commit and a GitHub
#     prerelease. `v1` stays put and no production site deploys.
#   - `main`: X.Y.Z to `latest`, the vX.Y.Z tag on the commit CI tested and a GitHub Release. It
#     commits nothing: `main` only moves when promote.yml fast-forwards it to its
#     `chore(release): X.Y.Z` commit on `beta`, which already holds the version, and the release
#     refuses to publish unless package.json says X.Y.Z (why in
#     docs/adr/0006-promote-by-fast-forward.md). Once the published package passes the smoke check,
#     `v1` moves to it (the docs tell people to use the Action as `chalharb/archidocs@v1` and the
#     GitLab template from `v1`).
# There is no changelog file: release notes live in GitHub Releases.
# Every passing push to `main` (each one a promotion) deploys the docs and demo sites to
# production, from the release tag when one was published (after its smoke check), otherwise from
# the commit CI tested.
#
# npm authenticates with trusted publishing (OIDC), so the repo holds no npm token, and every
# release, beta or stable, carries npm provenance. The release job runs in the `npm` environment.
# npm checks the calling workflow, not this file: on npmjs.com the archidocs Trusted Publisher
# names repository chalharb/archidocs, workflow ci.yml and that environment.
#
# RELEASE_TOKEN (a GitHub App token or fine-grained PAT with contents write) is required: it pushes
# the beta version commits and the release tags past the repo's rulesets. promote.yml uses it too.
# ci.yml passes it and the Cloudflare secrets in by name.
on:
  workflow_call:
    secrets:
      RELEASE_TOKEN:
        required: false # the release job's first step checks it, with a clearer error
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

# One release per branch at a time, never cancelled.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # OIDC for trusted publishing and provenance
    env:
      BRANCH: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
    outputs:
      current: ${{ steps.current.outputs.current }}
      published: ${{ steps.release.outputs.published }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check for RELEASE_TOKEN
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::The RELEASE_TOKEN secret is not set. semantic-release needs it to push the release commit and tags (see the comment at the top of publish.yml)."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          # The branch, not the bare commit: semantic-release releases a branch, and pushes to it.
          ref: ${{ github.ref_name }}
          # semantic-release reads every tag and commit since the last release.
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      # The checkout above is the branch's tip, which semantic-release would release whole, so a
      # newer commit CI hasn't passed yet stops this run here; `sites` reads `current` too.
      - name: Check the branch is still at the commit CI tested
        id: current
        run: |
          if [ "$(git rev-parse HEAD)" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$BRANCH has moved on since ${SHA:0:7}; the CI run for its newer commit releases both."
          fi
      - if: steps.current.outputs.current == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.current.outputs.current == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - if: steps.current.outputs.current == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.current.outputs.current == 'true'
        run: pnpm build
      # semantic-release fetches tags without --force, so a floating major tag (v1) that moved on the
      # remote since checkout fails the run with "would clobber existing tag". Dropping the local
      # copies lets that fetch recreate them.
      - name: Drop local floating major tags
        if: steps.current.outputs.current == 'true'
        run: git tag -l | grep -E '^v[0-9]+$' | xargs -r git tag -d
      - id: release
        if: steps.current.outputs.current == 'true'
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  smoke:
    # The package as users get it: installable from the registry, and reporting its own version.
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install and run the published package
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # The registry can take a minute to serve a new version.
          for attempt in $(seq 1 30); do
            if [ "$(npm view "archidocs@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then break; fi
            echo "archidocs@$VERSION is not on the registry yet (attempt $attempt)"
            sleep 10
          done
          actual="$(npx -y "archidocs@$VERSION" version --format json | jq -r .version)"
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::archidocs@$VERSION version reported '$actual'"
            exit 1
          fi
          echo "archidocs@$VERSION installs and reports $actual"

  major-tag:
    # Moved only after the smoke check passed, so `@v1` never points at a release that doesn't install.
    needs: [release, smoke]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
      - name: Move the major tag to this release
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # 1.2.0 → v1
          major="v${VERSION%%.*}"
          git tag --force "$major"
          git push --force origin "refs/tags/$major"

  sites:
    # Every passing push to `main` deploys production. After a release, it waits for the smoke check
    # and deploys the release tag, whose commit carries the new version; otherwise it deploys the
    # commit CI tested. Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see sites.yml); each
    # wrangler.jsonc holds its Worker and Custom Domains.
    needs: [release, smoke]
    if: >-
      always() && github.ref_name == 'main' && needs.release.result == 'success'
      && needs.release.outputs.current == 'true'
      && (needs.smoke.result == 'success' || (needs.smoke.result == 'skipped' && needs.release.outputs.published != 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { site: docs, dir: website, build: "docs:build" }
          - { site: big-bank, dir: examples/big-bank, build: "demo:big-bank" }
          - { site: kitchen-sink, dir: examples/kitchen-sink, build: "demo:kitchen-sink" }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for the Cloudflare secrets
        id: credentials
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Cloudflare secrets here, so ${{ matrix.site }} is not deployed."
          fi
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.published == 'true' && format('v{0}', needs.release.outputs.version) || github.sha }}
          # Full history: each docs page's "Last updated" date is the date of its file's last commit.
          fetch-depth: 0
      - if: steps.credentials.outputs.ready == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - if: steps.credentials.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      # The docs build takes its screenshots of the viewer in Chromium (website/src/lib/screenshots.ts).
      - if: steps.credentials.outputs.ready == 'true' && matrix.site == 'docs'
        run: pnpm exec playwright install --with-deps chromium
      # The docs name the release they document; on a commit that didn't release, `package.json`
      # names a version that isn't out, so the build is told.
      - if: steps.credentials.outputs.ready == 'true'
        env:
          RELEASED_VERSION: ${{ needs.release.outputs.published == 'true' && needs.release.outputs.version || '' }}
        run: |
          version="$RELEASED_VERSION"
          if [ -z "$version" ]; then
            version=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*')
            version="${version#v}"
          fi
          echo "ARCHIDOCS_DOCS_VERSION=$version" >> "$GITHUB_ENV"
      - if: steps.credentials.outputs.ready == 'true'
        run: pnpm "${{ matrix.build }}"
      - if: steps.credentials.outputs.ready == 'true'
        run: pnpm exec wrangler deploy --cwd "${{ matrix.dir }}"
