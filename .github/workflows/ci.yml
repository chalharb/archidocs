name: CI

# Pushes to main, plus every PR (which covers pushes to its branch).
# Triggering on all pushes too would run CI twice for each PR push.
# Changes only to agent and planning folders (specs, tickets, design notes) skip CI:
# nothing in the build, tests or docs reads them. No status check is required on main,
# so a PR that touches only these never waits on a check that didn't run.
on:
  push:
    branches: [main, beta]
    paths-ignore: [".scratch/**", ".impeccable/**", ".claude/**", "docs/**", "AGENTS.md"]
  pull_request:
    paths-ignore: [".scratch/**", ".impeccable/**", ".claude/**", "docs/**", "AGENTS.md"]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    # Two OSes, so golden SVGs are proven byte-identical across runners.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # `pnpm typecheck` runs `astro check`, which builds the MCP tool pages; their get_changes and list_history examples read the git history.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --coverage.enabled true
      - name: Report coverage on the PR
        uses: davelosert/vitest-coverage-report-action@v2
        if: (!cancelled()) && matrix.os == 'ubuntu-latest'
      - run: pnpm build

  docs:
    # The docs site in website/, built once (links validated, every `archidocs` line parsed; the
    # build takes its screenshots of the viewer in Chromium, website/src/lib/screenshots.ts), then
    # the Playwright suite in website/e2e against that build: Diagrams following the theme toggle, and search.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The MCP tool pages call get_changes and list_history, which read the git history.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          chromium: "true"
      - run: pnpm docs:build
      - run: pnpm test:e2e
        env:
          E2E_PROJECT: website
          E2E_DOCS_DIST: website/dist
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-website
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docs-test:
    # The docs site's unit tests (website/test), split in two: the fixture builds that must fail
    # run one at a time (Astro keeps build state in website/.astro) and take as long as the rest put together.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: fixtures, args: test/fixtures.test.ts }
          - { part: rest, args: --exclude test/fixtures.test.ts }
    name: docs-test (${{ matrix.part }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Each page's "Last updated" date, which the builds show, comes from the git history.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          chromium: "true"
      # The builds take screenshots of the viewer.
      - run: pnpm build:viewer
      - run: pnpm docs:test ${{ matrix.args }}

  e2e:
    # Playwright: the Viewer seam against fixture sites written by `archidocs build --out`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          chromium: "true"
      - run: pnpm test:e2e
        env:
          E2E_PROJECT: chromium
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  walkthroughs:
    # The tutorial "Model your first system" and the quick start (website/src/content/docs/docs/start/),
    # each run as a reader would in a temp folder: its shell blocks in order, with each file it shows,
    # using this repo's CLI. Their files must add up to examples/tutorial/ and examples/quick-start/;
    # for the quick start, `archidocs check` must pass and print what the page shows, and the README's
    # Quick start must match the page.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm docs:tutorial
      - run: pnpm docs:quick-start

  actionlint:
    # The workflows and the setup action under .github/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  action:
    # The reusable Action (action.yml) against fixture Workspace repos: a site with
    # images, a failed check that publishes nothing, and a PR preview. It never deploys.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Write the fixture Workspace repos
        run: |
          node scripts/fixture-workspace.ts "$RUNNER_TEMP/site"
          node scripts/fixture-workspace.ts "$RUNNER_TEMP/broken" --broken
          node scripts/fixture-workspace.ts "$RUNNER_TEMP/pr" --pr

      - name: Build a site with images
        id: site
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/site
          keep: "1"
          images: "true"
          deploy: "false"
      - name: The site holds the viewer, the kept past Bundles and the Saved View images
        env:
          SITE: ${{ steps.site.outputs.site }}
        run: |
          set -eux
          test -f "$SITE/index.html"
          test -f "$SITE/workspace.bundle.json"
          # One picture per Saved View the latest Bundle holds (Deployment Views can't be exported yet).
          ids="$(jq -r '.views[] | select(.level != "deployment") | .id | gsub("[/:]"; "-")' "$SITE/workspace.bundle.json")"
          test -n "$ids"
          for id in $ids; do test -f "$SITE/views/$id.svg"; done
          test "$(jq -c '[.revisions[] | [.subject, .tags, .bundle]]' "$SITE/bundles/index.json")" = \
            '[["Add Wishlist, rename Web, retire Legacy",[],true],["Add the Legacy shop",["v1"],true],["First model",[],false]]'
          test "$(ls "$SITE/bundles" | wc -l)" -eq 3

      - name: A failed check
        id: broken
        continue-on-error: true
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/broken
          deploy: "false"
      - name: The failed check stopped the Action and built nothing
        env:
          OUTCOME: ${{ steps.broken.outcome }}
        run: |
          set -eux
          test "$OUTCOME" = failure
          test ! -e "$RUNNER_TEMP/broken/_site"

      - name: Build a PR preview
        id: preview
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/pr
          preview: "true"
          base: main
      - name: The preview holds the base and the PR head, marked for Compare
        env:
          SITE: ${{ steps.preview.outputs.site }}
        run: |
          set -eux
          test "$(jq -r .preview.base "$SITE/bundles/index.json")" = main
          test "$(jq -c '[.revisions[].subject]' "$SITE/bundles/index.json")" = '["Add Gift cards","Add Wishlist, rename Web, retire Legacy"]'
