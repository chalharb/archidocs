name: CI

# Pushes to main, plus every PR (which covers pushes to its branch).
# Triggering on all pushes too would run CI twice for each PR push.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    # Two OSes, so golden SVGs are proven byte-identical across runners.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --coverage.enabled true
      - name: Report coverage on the PR
        uses: davelosert/vitest-coverage-report-action@v2
        if: (!cancelled()) && matrix.os == 'ubuntu-latest'
      - run: pnpm build

  e2e:
    # The Viewer seam: Playwright against fixture sites written by `archidocs build --out`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
