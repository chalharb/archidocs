name: Demos

# Builds the example sites in examples/* and deploys them to Cloudflare Workers
# (static assets, configured in each example's wrangler.jsonc):
#   - a push to main deploys production (big-bank.archidocs.dev, kitchen-sink.archidocs.dev)
#   - each PR gets a Worker Preview named pr-<number>, with its URL in a PR comment
#   - closing the PR deletes its Previews
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Account › Workers Scripts › Edit,
# Zone › Workers Routes › Edit and Zone › DNS › Edit on archidocs.dev) and
# CLOUDFLARE_ACCOUNT_ID. Without them (forks, Dependabot, before setup) the deploy
# jobs are skipped rather than failed.
on:
  push:
    branches: [main]
    paths-ignore: [".scratch/**", "**/*.md"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths-ignore: [".scratch/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: demos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  credentials:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Cloudflare secrets here, so the demos are not deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: credentials
    if: needs.credentials.outputs.ready == 'true' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the Preview URL comment
    strategy:
      fail-fast: false
      matrix:
        site: [big-bank, kitchen-sink]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE: ${{ matrix.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm "demo:$SITE"

      - name: Deploy production
        if: github.event_name == 'push'
        run: pnpm exec wrangler deploy --cwd "examples/$SITE"

      - name: Deploy the PR Preview
        id: preview
        if: github.event_name == 'pull_request'
        env:
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          # Keep wrangler's output even when it fails, so the log says why.
          status=0
          output="$(pnpm exec wrangler preview --cwd "examples/$SITE" --name "pr-$PR" --message "$TITLE" --json 2> "$RUNNER_TEMP/wrangler.err")" || status=$?
          cat "$RUNNER_TEMP/wrangler.err" >&2
          printf '%s\n' "$output"
          [ "$status" -eq 0 ] || exit "$status"
          # Upload progress comes before the JSON, which starts at the first line that is just "{".
          url="$(printf '%s\n' "$output" | sed -n '/^{$/,$p' | jq -er '.preview.urls[0]')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "**$SITE** Preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the Preview URL
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: demo-${{ matrix.site }}
          message: |
            **${{ matrix.site }}** demo Preview: ${{ steps.preview.outputs.url }}
            Built from ${{ github.event.pull_request.head.sha }}.

  cleanup:
    needs: credentials
    if: needs.credentials.outputs.ready == 'true' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [big-bank, kitchen-sink]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Delete the PR Preview
        env:
          PR: ${{ github.event.pull_request.number }}
          SITE: ${{ matrix.site }}
        # A PR whose Preview was never made (skipped or failed) has nothing to delete.
        run: pnpm exec wrangler preview delete --cwd "examples/$SITE" --name "pr-$PR" --skip-confirmation || true
