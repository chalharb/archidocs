# One-off (re-runnable) setup for the agent workflows: creates the labels and checks that every
# secret, variable and Project field the agents need is in place. See docs/agents.md.
name: "Agents: setup check"

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update labels
        run: scripts/agents/setup-labels.sh "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check secrets, variables and Project fields
        uses: actions/github-script@v7
        env:
          HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_DEV_APP_PRIVATE_KEY: ${{ secrets.DEV_APP_PRIVATE_KEY != '' }}
          HAS_PROJECT_PAT: ${{ secrets.PROJECT_PAT != '' }}
          DEV_APP_ID: ${{ vars.DEV_APP_ID }}
          DEV_APP_SLUG: ${{ vars.DEV_APP_SLUG }}
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER || github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER || '2' }}
        with:
          # The Project check reads the board as the PAT owner; nothing else in this step writes.
          github-token: ${{ secrets.PROJECT_PAT || github.token }}
          script: |
            const env = process.env;
            const rows = [];
            const check = (name, ok, fix) => rows.push(`| ${ok ? "✅" : "❌"} | ${name} | ${ok ? "" : fix} |`);
            check("secret ANTHROPIC_API_KEY", env.HAS_ANTHROPIC_API_KEY === "true", "Add the repository secret");
            check("secret DEV_APP_PRIVATE_KEY", env.HAS_DEV_APP_PRIVATE_KEY === "true", "Paste the dev App's .pem");
            check("secret PROJECT_PAT", env.HAS_PROJECT_PAT === "true", "Classic PAT with repo + project scopes");
            check("variable DEV_APP_ID", !!env.DEV_APP_ID, "The dev App's numeric App ID");
            check("variable DEV_APP_SLUG", !!env.DEV_APP_SLUG, "The dev App's URL name, e.g. archidocs-dev");

            if (env.HAS_PROJECT_PAT === "true") {
              const wanted = {
                Status: ["Backlog", "Ready", "In Progress", "In Review", "QA", "Ready to Merge", "Done"],
                Agent: ["Dev 1", "Dev 2"],
                Size: ["XS", "S", "M"],
              };
              try {
                const data = await github.graphql(
                  `query($owner: String!, $number: Int!) { user(login: $owner) { projectV2(number: $number) {
                     title fields(first: 50) { nodes { ... on ProjectV2SingleSelectField { name options { name } } } } } } }`,
                  { owner: env.PROJECT_OWNER, number: Number(env.PROJECT_NUMBER) },
                );
                const project = data.user.projectV2;
                check(`Project "${project.title}" reachable`, true, "");
                for (const [field, options] of Object.entries(wanted)) {
                  const f = project.fields.nodes.find((n) => n?.name?.toLowerCase() === field.toLowerCase());
                  const have = (f?.options ?? []).map((o) => o.name.toLowerCase());
                  const missing = options.filter((o) => !have.includes(o.toLowerCase()));
                  check(`Project field ${field}`, !!f && missing.length === 0,
                    f ? `Missing options: ${missing.join(", ")}` : "Add a single-select field");
                }
              } catch (e) {
                check(`Project ${env.PROJECT_OWNER}/${env.PROJECT_NUMBER} reachable`, false, e.message);
              }
            }

            const ok = rows.every((r) => r.startsWith("| ✅"));
            await core.summary
              .addHeading("Agent setup check")
              .addRaw(["| | Item | Fix |", "|---|---|---|", ...rows].join("\n"), true)
              .write();
            if (!ok) core.setFailed("Some agent prerequisites are missing; see the job summary.");
